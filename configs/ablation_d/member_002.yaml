model:
  arch: hierarchical
  d_model: 128
  n_intra_layers: 2
  n_cross_layers: 2
  n_heads: 4
  d_ff: 512
  dropout: 0.1

training:
  batch_size: 512
  lr: 3.0e-4
  weight_decay: 0.01
  label_smoothing: 0.03
  max_epochs: 100
  patience: 15
  seed: 137
  num_workers: 4
  loss_mode: action90_all

data:
  regime: a
  split_dir: data/assembled/regime_a
